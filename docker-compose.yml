services:
  craft-office:
    image: craft-office:latest
    build: .
    container_name: craft-office
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Creates this user on the first start (only while no user exists yet).
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (8+ characters)}
    volumes:
      - ./data:/data
